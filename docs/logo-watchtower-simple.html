<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><title>LeaseLookout — minimal watchtower</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--paper:#faf8f2;--ink:#23211e;--muted:#6b675e;--emerald:#1d6e62;--red:#b4422b;--border:rgba(35,33,30,.12);}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  .wrap{max-width:1020px;margin:0 auto;padding:40px 48px 64px}
  h1{font-family:"Instrument Serif",serif;font-weight:400;font-size:38px;letter-spacing:-.02em;margin:0 0 4px}
  .sub{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 30px}
  .row{display:grid;grid-template-columns:140px 1fr;align-items:center;gap:24px;padding:26px 0;border-top:1px solid var(--border)}
  .name{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.1em;color:var(--muted);line-height:1.5}
  .name b{display:block;font-family:Inter;font-size:14px;letter-spacing:0;color:var(--ink);margin-bottom:5px;font-weight:600}
  .sizes{display:flex;align-items:flex-end;gap:22px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px}
  .cap{font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--muted)}
  .mark{color:var(--emerald)}
  .tile{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center}
  .tile.paper{background:var(--paper);border:1px solid var(--border)}
  .tile.em{background:var(--emerald)}
  .tile.em .mark{color:var(--paper)}
  .wordmark{display:flex;align-items:center;gap:7px;margin-left:8px}
  .wm{font-weight:600;font-size:23px;letter-spacing:-.01em}
  .dark{background:#17150f;border-radius:12px;margin-top:38px;padding:26px 36px;color:#ece6d8}
  .dark .name b{color:#ece6d8}.dark .row{border-top:1px solid rgba(236,230,216,.14)}
  .dark .mark{color:#5fae9f}
  .darkhd{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.16em;color:#9c968a;margin:0 0 6px}
  svg{display:block}
</style></head><body><div class="wrap">
<h1>LeaseLookout — minimal watchtower</h1>
<p class="sub">bold + filled · ≤3 elements · shown at 48 / 32 / 24 / 16 px + app-icon tiles</p>
<div id="light"></div>
<div class="dark"><p class="darkhd">On dark</p><div id="darkrow"></div></div>
</div>
<script>
const MARKS={
  solid:`<svg class="mark" width="S" height="S" viewBox="0 0 24 24">
    <path d="M9 9H15L16.5 20H7.5Z" fill="currentColor"/>
    <path d="M12 4.3 16.2 9H7.8Z" fill="currentColor"/>
    <circle cx="12" cy="2.9" r="1.25" fill="#b4422b"/></svg>`,
  cabin:`<svg class="mark" width="S" height="S" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8.4 20 10 12.8M15.6 20 14 12.8"/>
    <path d="M9 12.8H15V10L12 7.4 9 10Z" fill="currentColor" stroke-width="1.6"/>
    <circle cx="12" cy="10.7" r=".95" fill="#b4422b" stroke="none"/></svg>`,
  chevron:`<svg class="mark" width="S" height="S" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.8 16 12 8l6.2 8"/>
    <path d="M8 20h8"/>
    <circle cx="12" cy="6" r="1.25" fill="#b4422b" stroke="none"/></svg>`,
};
const DEFS=[
  ["solid","Solid tower","one filled silhouette + red beacon. Boldest, most favicon-proof."],
  ["cabin","Cabin on legs","filled cabin on two bold legs; red watch-window dot. Most “fire-lookout.”"],
  ["chevron","Beacon peak","a bold lookout peak on a platform + red beacon. Most minimal/abstract."],
];
const SIZES=[48,32,24,16];
function row(k,t,d){
  const m=s=>MARKS[k].replace(/width="S" height="S"/,`width="${s}" height="${s}"`);
  const tile=s=>MARKS[k].replace(/width="S" height="S"/,`width="${s}" height="${s}"`);
  const sizeCells=SIZES.map(s=>`<div class="cell">${m(s)}<span class="cap">${s}</span></div>`).join("");
  return `<div class="row"><div class="name"><b>${t}</b>${d}</div>
    <div class="sizes">${sizeCells}
      <div class="cell"><div class="tile paper">${tile(28)}</div><span class="cap">icon</span></div>
      <div class="cell"><div class="tile em">${tile(28)}</div><span class="cap">icon</span></div>
      <div class="wordmark">${m(26)}<span class="wm">LeaseLookout</span></div>
    </div></div>`;
}
document.getElementById("light").innerHTML=DEFS.map(d=>row(d[0],d[1],d[2])).join("");
document.getElementById("darkrow").innerHTML=DEFS.map(d=>row(d[0],d[1],"")).join("");
</script></body></html>
